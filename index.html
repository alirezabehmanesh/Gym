<title>Gym Log</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#101a33;--mute:#7b869d;--line:#e8ecf5;--acc:#3a55ff;--acc2:#eef1ff;--ok:#12995a;--okbg:#e7f6ee;--warn:#c56a00;--wbg:#fff3e0;--sh:0 1px 2px rgba(16,26,51,.04),0 8px 22px rgba(40,64,140,.08);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
[dir=ltr]{unicode-bidi:isolate}
#app{max-width:440px;margin:auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px 28px}
nav{display:flex;gap:2px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:14px;color:var(--mute);font-size:10.5px;text-align:center}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--acc);font-weight:700}nav .on svg{stroke-width:2.3}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px;min-height:42px}
.top h1{flex:1;font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.top .sub{display:block;color:var(--mute);font-size:13px;font-weight:500;letter-spacing:0}
.back{width:42px;height:42px;flex:none;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.back svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:var(--sh)}
.card small,.mute{color:var(--mute);font-size:13px}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin:20px 4px 6px}
.hint{border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px;background:var(--acc2);color:#2338c4}
.hint.ok{background:var(--okbg);color:#0d7a46}.hint.w{background:var(--wbg);color:var(--warn)}
.btn{display:block;width:100%;padding:15px;margin:10px 0;border-radius:16px;background:var(--card);box-shadow:var(--sh);text-align:center;font-weight:600}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 8px 20px rgba(58,85,255,.28)}
.btn.red{color:#c0392b}
.btn.sm{padding:11px;font-size:14px}
/* hero */
.hero{border-radius:24px;padding:16px 18px 18px;margin:4px 0 14px;color:#fff;background:linear-gradient(140deg,#3a55ff 0%,#6a7dff 100%);box-shadow:0 14px 30px rgba(58,85,255,.3)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px}
.badge{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.ghost{font-size:12px;font-weight:700;background:#fff;color:var(--acc);padding:4px 12px;border-radius:999px}
.sel{position:relative;margin:8px 0 2px}
.sel select{-webkit-appearance:none;appearance:none;width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:14px;color:#fff;font-size:20px;font-weight:800;padding:10px 14px 10px 40px}
.sel select option{color:#101a33}
.sel svg{position:absolute;left:12px;top:50%;width:20px;height:20px;margin-top:-10px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bar{height:7px;background:rgba(255,255,255,.28);border-radius:4px;margin:14px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .3s}
.hero small{color:#e4e8ff;font-size:13px}
/* body-part cards */
.part{background:var(--card);border-radius:var(--r);margin:10px 0;box-shadow:var(--sh);overflow:hidden;border:1.5px solid transparent}
.part.done{border-color:#bfe8d1;background:#fbfefc}
.ph{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 12px}
.num{width:34px;height:34px;flex:none;border-radius:11px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.done .num{background:var(--ok);color:#fff}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:17px;font-weight:800}
.pt small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small i{font-style:normal;color:var(--acc);font-weight:600}.done .pt small i{color:var(--ok)}
.chev{width:18px;height:18px;flex:none;fill:none;stroke:var(--mute);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.open .chev{transform:rotate(-90deg)}
.pl{display:none;border-top:1px solid var(--line);padding:4px 0}.open .pl{display:block}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px}
.row+.row{border-top:1px solid var(--line)}
.row div{flex:1;min-width:0}.row b{display:block;font-weight:600;font-size:15px}.row small{display:block;color:var(--mute);font-size:12.5px}
.row.sug{background:#f6f8ff}.row .st{font-size:11px;font-weight:800;color:var(--acc);margin-inline-start:6px}
.tag{flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#f0f2f7;color:var(--mute);white-space:nowrap}
.tag.up{background:var(--okbg);color:var(--ok)}.tag.w{background:var(--wbg);color:var(--warn)}.tag.ok{background:var(--ok);color:#fff}
.more{display:block;width:100%;padding:11px 16px;color:var(--acc);font-size:13px;font-weight:700;border-top:1px solid var(--line)}
.oth{background:#fafbfd}
/* exercise page */
.exh{display:flex;gap:14px;align-items:flex-start;margin:2px 0 6px}
.exi{flex:1;min-width:0}.exi h2{font-size:22px;font-weight:800;line-height:1.25;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.c2{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--acc2);color:var(--acc)}.c2.lo{background:#e2f6f5;color:#08807c}
.mus{font-size:14px}.mus span{color:var(--mute)}
.pw{position:relative;flex:none}
.thumb{width:96px;height:96px;border-radius:22px;background:#e6ecfb center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--sh)}
.thumb.big{width:100%;max-width:260px;height:auto;aspect-ratio:1;margin:6px auto 4px}
.gear{position:absolute;left:-7px;top:-7px;width:32px;height:32px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.gear svg{width:17px;height:17px}
.timer{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:var(--r);padding:12px 16px;margin:12px 0;box-shadow:var(--sh)}
.timer svg{width:58px;height:58px;flex:none;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}.timer .rb{stroke:var(--acc2)}.timer .rf{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer b{display:block;font-size:17px;font-weight:800}.timer small{color:var(--mute);font-size:13px}
.timer.run{background:var(--acc2)}.timer.fin .rf{stroke:var(--ok)}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.set{background:var(--card);border-radius:18px;padding:10px 8px 8px;text-align:center;box-shadow:var(--sh);color:var(--mute);font-size:12.5px;font-weight:600}
.set.one{grid-column:1/-1}
.set input{display:block;width:100%;border:0;border-radius:12px;background:var(--bg);margin-top:6px;padding:11px 4px;font-size:19px;font-weight:800;text-align:center;direction:ltr;color:var(--ink);outline:none}
.set input:focus{background:var(--acc2)}
.seg{display:flex;gap:8px;background:#e6eaf3;border-radius:16px;padding:4px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;font-weight:700;color:var(--mute);text-align:center}
.seg .on1{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(18,153,90,.3)}.seg .on0{background:#fff;color:var(--warn);box-shadow:var(--sh)}
.reps{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh);font-size:14px}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:38px;height:38px;border-radius:12px;background:var(--acc2);color:var(--acc);font-size:22px;font-weight:700;text-align:center}
.stp input{width:56px;border:0;background:var(--bg);border-radius:12px;padding:8px 0;text-align:center;font-size:18px;font-weight:800}
.hl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;font-size:13.5px}.hl+.hl{border-top:1px solid var(--line)}
.hl .w{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600}
/* lists, forms */
.srch{position:relative;margin-bottom:6px}.srch input{width:100%;border:0;border-radius:16px;background:var(--card);box-shadow:var(--sh);padding:14px 44px 14px 14px;outline:none}
.srch svg{position:absolute;right:14px;top:50%;margin-top:-10px;width:20px;height:20px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round}
.li{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border-radius:18px;padding:13px 16px;margin:8px 0;box-shadow:var(--sh)}
.li div{flex:1;min-width:0}.li b{display:block;font-weight:700}.li small{display:block;color:var(--mute);font-size:12.5px}
.li .dt{flex:none;font-size:12px;color:var(--mute);text-align:left}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--acc)}.dot.lo{background:#0b9e9a}
label.f{display:block;margin:12px 0;color:var(--mute);font-size:13px;font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:6px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:500}
.chip{display:inline-block;padding:9px 14px;margin:4px 0 4px 6px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid #cfd7e6;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px}.ck.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dc{display:flex;align-items:center;gap:10px}.dc .mv{display:flex;flex-direction:column;gap:4px}.mv button{width:30px;height:24px;border-radius:8px;background:var(--acc2);color:var(--acc);font-size:12px;text-align:center}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.gh b{flex:1;font-size:17px;font-weight:800}
.mini{padding:6px 12px;border-radius:999px;background:var(--acc2);color:var(--acc);font-size:13px;font-weight:700}.mini.x{background:#fdeceb;color:#c0392b}
.ex{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.ex b{flex:1;font-weight:600;font-size:14.5px}
.ord{width:22px;height:22px;border-radius:7px;background:var(--bg);color:var(--mute);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.hday{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.hday b{font-weight:800}
.fs{position:fixed;inset:0;background:rgba(5,10,25,.94);z-index:9;display:flex;align-items:center;justify-content:center}.fs img{max-width:100%;max-height:100%}
.gs{display:block;text-align:center;color:var(--acc);font-size:13px;font-weight:600;margin:4px 0 8px}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px}
</style></head><body><div id="app"></div>
<script>

// ---------- storage & migration
function migrate(x){x=x&&typeof x=='object'?x:{};x.logs=x.logs||{};x.cx=x.cx||{};x.mu=x.mu||{};x.ov=x.ov||{};x.days=x.days||[];x.bk=x.bk||'';
 if(x.logs.ch){x.logs.bar=(x.logs.bar||[]).concat(x.logs.ch);delete x.logs.ch}
 if(!(x.v>=2)){
  if(x.logs.gl){x.logs.gk=(x.logs.gk||[]).concat(x.logs.gl);delete x.logs.gl}
  delete x.mu.gl;delete x.ov.gl;
  x.days.forEach(d=>d.parts.forEach(p=>{p.ex=p.ex.map(i=>i=='gl'?'gk':i).filter((i,j,a)=>a.indexOf(i)==j)}));
  for(const id in SEED){const L=x.logs[id]=x.logs[id]||[];SEED[id].forEach(e=>{if(!L.some(o=>o.d==e.d))L.push({...e})})}
  const M={ua:'d1',la:'d2',ub:'d3',lb:'d4'};
  for(const id in x.logs)x.logs[id].forEach(e=>{if(M[e.p])e.p=M[e.p];delete e.s});
  if(!x.days.length)x.days=defDays();
  for(const k in x.mu)if(x.mu[k]&&typeof x.mu[k]=='object')x.mu[k]=x.mu[k].m||'';
  delete x.ci;delete x.fin;delete x.add;x.v=2}
 for(const id in x.logs)x.logs[id].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.t||0)-(b.t||0));
 return x}
function load(){try{const s=localStorage.getItem('gymlog');if(s)return migrate(JSON.parse(s))}catch(e){}return migrate({})}

// ---------- which day is today: next one after the last trained day
function autoIdx(){const n=db.days.length;if(!n)return -1;let b=null;
 for(const id in db.logs)for(const e of db.logs[id]){const j=db.days.findIndex(d=>d.id==e.p);if(j<0)continue;if(!b||e.d>b.d||(e.d==b.d&&(e.t||0)>=b.t))b={d:e.d,t:e.t||0,j}}
 return !b?0:b.d==D()?b.j:(b.j+1)%n}
function curIdx(){const T=D();if(db.sel&&db.sel.d==T){const j=db.days.findIndex(d=>d.id==db.sel.id);if(j>=0)return j}return autoIdx()}

// ---------- rotation: for each body part suggest the exercise after the one done last time
function plan(d){const used=new Set(),out=d.parts.map(p=>{const dn=[...p.ex,...pool(p.a)].find(i=>!used.has(i)&&tod(i));if(dn)used.add(dn);return{p,dn}});
 out.forEach(o=>{if(o.dn)return;const ex=o.p.ex.length?o.p.ex:pool(o.p.a);if(!ex.length)return;let li=-1,ld='';
  ex.forEach((i,j)=>{const l=lst(i);if(l&&l.d>=ld){ld=l.d;li=j}});
  for(let k=1;k<=ex.length;k++){const c=ex[(li+k)%ex.length];if(!used.has(c)){o.s=c;used.add(c);break}}
  if(!o.s)o.s=ex[(li+1)%ex.length]});
 return out}

const pm=(k,j,dd)=>{const p=dy(k).parts,x=j+dd;if(x<0||x>=p.length)return;[p[j],p[x]]=[p[x],p[j]];save();render(1)};
const tx=(k,a,i)=>{const p=dy(k).parts.find(p=>p.a==a),j=p.ex.indexOf(i);j<0?p.ex.push(i):p.ex.splice(j,1);save();render(1)};
function day(){const k=v.k,d=dy(k);if(!d)return prog();const j=db.days.indexOf(d);
 return hdr(d.n,`go('prog')`,'روز '+fn(j+1)+' · '+fn(d.parts.length)+' بخش')+`<div class="hint">حرکت‌های هر بخش به نوبت پیشنهاد میشن: هر بار حرکت بعد از دفعه‌ی قبل. ترتیب لیست همون ترتیب نوبته.</div>`+
 d.parts.map((p,x)=>`<div class="card"><div class="gh"><div class="mv" style="display:flex;flex-direction:column;gap:3px"><button class="mini" style="padding:1px 8px" onclick="pm('${k}',${x},-1)">▲</button><button class="mini" style="padding:1px 8px" onclick="pm('${k}',${x},1)">▼</button></div><b>${A[p.a]}</b><button class="mini" onclick="go('pick',{k:'${k}',a:'${p.a}'})">ویرایش حرکات</button><button class="mini x" onclick="rp('${k}','${p.a}')">حذف</button></div>`+
 (p.ex.length?p.ex.map((i,n)=>`<div class="ex"><span class="ord">${fn(n+1)}</span><b dir="ltr" style="text-align:right">${X(i)[0]}</b></div>`).join(''):`<div class="ex"><small class="mute">حرکتی انتخاب نشده</small></div>`)+`</div>`).join('')+
 `<button class="btn pri" onclick="go('parts',{k:'${k}'})">+ بخش بدن</button><button class="btn" onclick="rn('${k}')">تغییر نام روز</button><button class="btn red" onclick="dl('${k}')">حذف روز</button>`}
function parts(){const k=v.k,d=dy(k),has=a=>d.parts.some(p=>p.a==a);
 return hdr('افزودن بخش بدن',`go('day',{k:'${k}'})`)+[['بالاتنه',PUP],['پایین‌تنه',PLO]].map(([t,l])=>`<div class="sec">${t}</div>`+l.map(a=>`<button class="chip ${has(a)?'on':''}" onclick="ap('${k}','${a}')">${A[a]}</button>`).join('')).join('')}
function pick(){const{k,a}=v,p=dy(k).parts.find(p=>p.a==a);if(!p)return day();
 return hdr(A[a],`go('day',{k:'${k}'})`,'حرکت‌هایی که به نوبت پیشنهاد بشن')+`<div class="hint">هر حرکتی که می‌خوای توی نوبت این بخش باشه رو تیک بزن. شماره‌ها ترتیب نوبت رو نشون میدن.</div>`+
 pool(a).map(i=>{const n=p.ex.indexOf(i);return`<button class="li" onclick="tx('${k}','${a}','${i}')"><span class="ck ${n>=0?'on':''}">${n>=0?fn(n+1):''}</span><div><b dir="ltr" style="text-align:right">${X(i)[0]}</b><small dir="ltr" style="text-align:right">${lst(i)?fw(i,lst(i)):'بدون سابقه'}</small></div></button>`}).join('')+
 `<button class="btn" onclick="go('add',{k:'${k}',a:'${a}'})">+ حرکت جدید برای این بخش</button>`}

// ---------- exercise library
const nz=s=>(s||'').toLowerCase().replace(/[‌\s]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک');
const lrows=s=>{s=nz(s);return ids().filter(i=>nz(X(i)[0]+arn(i)+tier(i)+(A[mus(i)]||'')).includes(s)).map(i=>{const l=lst(i);
 return`<button class="li" onclick='go("ex",{i:"${i}",o:"lib",q:${q(v.q||'')}})'><span class="dot ${tier(i)=='بالاتنه'?'':'lo'}"></span><div><b dir="ltr" style="text-align:right">${X(i)[0]}</b><small>${arn(i)} · ${tier(i)}</small></div><span class="dt">${l?fd(l.d).replace(/^[^ ]+ /,''):'ثبت نشده'}</span></button>`}).join('')||'<div class="empty">حرکتی پیدا نشد</div>'};
const lq=s=>{v.q=s;$('#ll').innerHTML=lrows(s)};
const lib=()=>hdr('حرکات','',fn(ids().length)+' حرکت')+`<div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="qq" placeholder="اسم حرکت، بخش بدن، بالاتنه یا پایین‌تنه" value="${(v.q||'').replace(/"/g,'')}" oninput="lq(this.value)"></div><div id="ll">${lrows(v.q)}</div><button class="btn pri" onclick="go('add')">+ حرکت جدید</button>`;
function add(){const og=(l,t)=>`<optgroup label="${t}">${l.map(a=>`<option value="${a}" ${a==v.a?'selected':''}>${A[a]}</option>`).join('')}</optgroup>`;
 return hdr('حرکت جدید',v.k?`go('pick',{k:'${v.k}',a:'${v.a}'})`:`go('lib')`)+`<label class="f">بخش بدن<select id="ar">${og(PUP,'بالاتنه')}${og(PLO,'پایین‌تنه')}</select></label><label class="f">اسم حرکت<input id="nm"></label>
 <label class="f">نوع وزنه<select id="md"><option value="3">سه وزنه (هر ست جدا)</option><option value="1">یک وزنه برای هر ۳ ست</option></select></label><button class="btn pri" onclick="addx()">افزودن</button>`}
function addx(){const n=$('#nm').value.trim();if(!n)return alert('اسم حرکت رو بنویس');const id='c'+Date.now(),a=$('#ar').value;db.cx[id]=[n,a,$('#md').value];db.mu[id]=a=='fa'?'ff':a;
 if(v.k&&v.a){const p=dy(v.k).parts.find(p=>p.a==v.a);if(p&&pool(v.a).includes(id))p.ex.push(id)}save();v.k?go('pick',{k:v.k,a:v.a}):go('lib')}

// ---------- history & settings
function hist(){const g={};for(const i in db.logs)db.logs[i].forEach(e=>(g[e.d]=g[e.d]||[]).push([i,e]));const ks=Object.keys(g).sort().reverse();
 return hdr('تاریخچه','',fn(ks.length)+' جلسه')+(ks.length?'':'<div class="empty">هنوز چیزی ثبت نشده</div>')+ks.slice(0,80).map(d=>{const p=g[d].map(x=>x[1].p).find(x=>dy(x)),dn=p&&dy(p);
 return`<div class="card"><div class="hday"><b>${fd(d)}</b>${dn?`<span class="c2">${dn.n}</span>`:''}</div>${g[d].map(([i,e])=>`<div class="hl"><span dir="ltr" style="font-weight:600">${X(i)[0]}</span><span><span class="w">${fw(i,e)}</span> ${e.ok?'👍':'· '+fn(e.r??'?')}</span></div>`).join('')}</div>`}).join('')}
function sett(){return hdr('تنظیمات')+`<div class="card"><b>پشتیبان‌گیری</b><small style="display:block">آخرین پشتیبان: ${db.bk?fd(db.bk):'هنوز نگرفتی'}</small></div>
 <button class="btn pri" onclick="exp()">خروجی گرفتن (پشتیبان)</button><button class="btn" onclick="$('#f').click()">برگردوندن اطلاعات از فایل</button>
 <input id="f" type="file" accept=".json,application/json" hidden onchange="imp(this.files[0])">
 <div class="sec">برنامه</div><button class="btn" onclick="rdef()">بازگردانی برنامه‌ی پیش‌فرض ۴ روزه</button>
 <p class="mute" style="text-align:center;margin-top:18px;font-size:12px">Gym Log · نسخه ۹ · داده‌ها فقط روی همین گوشی ذخیره میشن</p>`}
const rdef=()=>{if(confirm('روزهای تمرین با برنامه‌ی پیش‌فرض ۴ روزه جایگزین بشن؟ تاریخچه‌ی وزنه‌ها حفظ میشه.')){db.days=defDays();db.sel=null;save();tab('home')}};
async function exp(){const b=new Blob([JSON.stringify(db)],{type:'application/json'}),n='gym-backup-'+D()+'.json',f=new File([b],n,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){return}}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
 db.bk=D();save();render()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.logs)throw 0;if(confirm('اطلاعات فعلی با فایل جایگزین بشه؟')){db=migrate(x);save();tab('home')}}catch(e){alert('فایل معتبر نیست')}};r.readAsText(f)}

// ---------- photos (stored on the phone)
const idb=()=>new Promise(r=>{try{const o=indexedDB.open('gymimg',1);o.onupgradeneeded=()=>o.result.createObjectStore('i');o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});
const gi=async id=>{const d=await idb();return d?new Promise(r=>{const o=d.transaction('i').objectStore('i').get(id);o.onsuccess=()=>r(o.result);o.onerror=()=>r()}):0};
let PH='';
const ph=u=>{PH=u||'';const p=$('#ph');if(p){p.style.backgroundImage=u?'url('+u+')':'';p.textContent=u?'':'📷'}};
const pz=()=>{if(!PH)return go('edit',{i:v.i,k:v.k,a:v.a,o:v.o});const o=document.createElement('div');o.className='fs';o.innerHTML='<img src="'+PH+'">';o.onclick=()=>o.remove();document.body.appendChild(o)};
const rmi=async id=>{const d=await idb();if(d)d.transaction('i','readwrite').objectStore('i').delete(id);ph('')};
async function si(id,f){if(!f)return;try{const im=await createImageBitmap(f),c=document.createElement('canvas'),k=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const u=c.toDataURL('image/jpeg',.82),d=await idb();d.transaction('i','readwrite').objectStore('i').put(u,id);ph(u)}catch(e){alert('ذخیره‌ی عکس نشد')}}

// ---------- rest timer (30 s) with sound + notification
let TE=0,TI=0,FD=1,AC=null,WL=null;const TL=30;
const askN=()=>{try{if('Notification' in window&&Notification.permission=='default')Notification.requestPermission()}catch(e){}};
const lock=async()=>{try{if(navigator.wakeLock){if(WL)WL.release().catch(()=>{});WL=await navigator.wakeLock.request('screen')}}catch(e){}};
const beep=()=>{try{[0,.35,.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.3)})}catch(e){}};
const fin=async()=>{beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}try{if(WL){WL.release();WL=null}}catch(e){}
 try{if('Notification' in window&&Notification.permission=='granted'){const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(),o={body:'ست بعدی رو شروع کن',tag:'rest',renotify:true};r?r.showNotification('تایم استراحت تموم شد',o):new Notification('تایم استراحت تموم شد',o)}}catch(e){}};
function tick(){const t=$('#tt'),s=$('#ts'),g=$('#rg'),b=$('#tm');if(!TE){return}const r=Math.ceil((TE-Date.now())/1000);
 if(r>0){if(t){t.textContent=fn(r)+' ثانیه';s.textContent='در حال استراحت… بزن تا از اول بشمره';g.style.strokeDashoffset=RC*(1-(TE-Date.now())/(TL*1000));b.className='timer run'}}
 else{clearInterval(TI);TE=0;if(!FD){FD=1;fin()}if(t){t.textContent='استراحت تموم شد ✓';s.textContent='ست بعدی رو شروع کن';g.style.strokeDashoffset=RC;b.className='timer fin'}}}
const rt=()=>{if(TI)clearInterval(TI);try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}askN();lock();TE=Date.now()+TL*1000;FD=0;tick();TI=setInterval(tick,250)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

// ---------- shell
const IC={home:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',prog:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v2h6V4M12 10v6M9 13h6"/>',lib:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',hist:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const TABS=[['home','تمرین'],['prog','ساخت برنامه'],['lib','حرکات'],['hist','تاریخچه'],['set','تنظیمات']];
function render(keep){const y=keep&&$('main')?$('main').scrollTop:0,s=v.s,m={home,prog,hist,lib,set:sett,add,edit,ex:exs,day,parts,pick};
 if(s=='ex'||s=='edit')v.tab=v.o=='home'?'home':v.o=='lib'?'lib':'prog';
 $('#app').innerHTML=`<main>${(m[s]||home)()}</main><nav>${TABS.map(([k,t])=>`<button class="${v.tab==k?'on':''}" onclick="tab('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg>${t}</button>`).join('')}</nav>`;
 $('main').scrollTop=y;if(s=='ex'||s=='edit'){ph('');gi(v.i).then(u=>ph(u))}if(s=='ex'&&TE)tick();}
render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();navigator.serviceWorker&&navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
