<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#f2f5fb"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Gym Log</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#101a33;--mute:#7b869d;--line:#e8ecf5;--acc:#3a55ff;--acc2:#eef1ff;--ok:#12995a;--okbg:#e7f6ee;--warn:#c56a00;--wbg:#fff3e0;--sh:0 1px 2px rgba(16,26,51,.04),0 8px 22px rgba(40,64,140,.08);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
[dir=ltr]{unicode-bidi:isolate}
#app{max-width:440px;margin:auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px 28px}
nav{display:flex;gap:2px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:14px;color:var(--mute);font-size:10.5px;text-align:center}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--acc);font-weight:700}nav .on svg{stroke-width:2.3}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px;min-height:42px}
.top h1{flex:1;font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.top .sub{display:block;color:var(--mute);font-size:13px;font-weight:500;letter-spacing:0}
.back{width:42px;height:42px;flex:none;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.back svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:var(--sh)}
.card small,.mute{color:var(--mute);font-size:13px}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin:20px 4px 6px}
.hint{border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px;background:var(--acc2);color:#2338c4}
.hint.ok{background:var(--okbg);color:#0d7a46}.hint.w{background:var(--wbg);color:var(--warn)}
.btn{display:block;width:100%;padding:15px;margin:10px 0;border-radius:16px;background:var(--card);box-shadow:var(--sh);text-align:center;font-weight:600}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 8px 20px rgba(58,85,255,.28)}
.btn.red{color:#c0392b}
.btn.sm{padding:11px;font-size:14px}
/* hero */
.hero{border-radius:24px;padding:16px 18px 18px;margin:4px 0 14px;color:#fff;background:linear-gradient(140deg,#3a55ff 0%,#6a7dff 100%);box-shadow:0 14px 30px rgba(58,85,255,.3)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px}
.badge{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.ghost{font-size:12px;font-weight:700;background:#fff;color:var(--acc);padding:4px 12px;border-radius:999px}
.sel{position:relative;margin:8px 0 2px}
.sel select{-webkit-appearance:none;appearance:none;width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:14px;color:#fff;font-size:20px;font-weight:800;padding:10px 40px 10px 14px}
.sel select option{color:#101a33}
.sel svg{position:absolute;right:12px;top:50%;width:20px;height:20px;margin-top:-10px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bar{height:7px;background:rgba(255,255,255,.28);border-radius:4px;margin:14px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .3s}
.hero small{color:#e4e8ff;font-size:13px}
/* body-part cards */
.part{background:var(--card);border-radius:var(--r);margin:10px 0;box-shadow:var(--sh);overflow:hidden;border:1.5px solid transparent}
.part.done{border-color:#bfe8d1;background:#fbfefc}
.ph{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px 14px 14px}
.num{width:34px;height:34px;flex:none;border-radius:11px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.done .num{background:var(--ok);color:#fff}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:17px;font-weight:800}
.pt small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small i{font-style:normal;color:var(--acc);font-weight:600}.done .pt small i{color:var(--ok)}
.chev{width:18px;height:18px;flex:none;fill:none;stroke:var(--mute);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.open .chev{transform:rotate(90deg)}
.pl{display:none;border-top:1px solid var(--line);padding:4px 0}.open .pl{display:block}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px}
.row+.row{border-top:1px solid var(--line)}
.row div{flex:1;min-width:0}.row b{display:block;font-weight:600;font-size:15px}.row small{display:block;color:var(--mute);font-size:12.5px}
.row.sug{background:#f6f8ff}.row .st{font-size:11px;font-weight:800;color:var(--acc);margin-inline-start:6px}
.tag{flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#f0f2f7;color:var(--mute);white-space:nowrap}
.tag.up{background:var(--okbg);color:var(--ok)}.tag.w{background:var(--wbg);color:var(--warn)}.tag.ok{background:var(--ok);color:#fff}
.more{display:block;width:100%;padding:11px 16px;color:var(--acc);font-size:13px;font-weight:700;border-top:1px solid var(--line)}
.oth{background:#fafbfd}
/* exercise page */
.exh{display:flex;gap:14px;align-items:flex-start;margin:2px 0 6px}
.exi{flex:1;min-width:0}.exi h2{font-size:22px;font-weight:800;line-height:1.25;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.c2{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--acc2);color:var(--acc)}.c2.lo{background:#e2f6f5;color:#08807c}
.mus{font-size:14px}.mus span{color:var(--mute)}
.pw{position:relative;flex:none}
.thumb{width:96px;height:96px;border-radius:22px;background:#e6ecfb center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--sh)}
.thumb.big{width:100%;max-width:260px;height:auto;aspect-ratio:1;margin:6px auto 4px}
.gear{position:absolute;right:-7px;top:-7px;width:32px;height:32px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.gear svg{width:17px;height:17px}
.timer{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:var(--r);padding:12px 16px;margin:12px 0;box-shadow:var(--sh)}
.timer svg{width:58px;height:58px;flex:none;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}.timer .rb{stroke:var(--acc2)}.timer .rf{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer b{display:block;font-size:17px;font-weight:800}.timer small{color:var(--mute);font-size:13px}
.timer.run{background:var(--acc2)}.timer.fin .rf{stroke:var(--ok)}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.set{background:var(--card);border-radius:18px;padding:10px 8px 8px;text-align:center;box-shadow:var(--sh);color:var(--mute);font-size:12.5px;font-weight:600}
.set.one{grid-column:1/-1}
.set input{display:block;width:100%;border:0;border-radius:12px;background:var(--bg);margin-top:6px;padding:11px 4px;font-size:19px;font-weight:800;text-align:center;direction:ltr;color:var(--ink);outline:none}
.set input:focus{background:var(--acc2)}
.seg{display:flex;gap:8px;background:#e6eaf3;border-radius:16px;padding:4px}
.seg button{flex:1;padding:12px 6px;border-radius:12px;font-weight:700;color:var(--mute);text-align:center}
.seg .on1{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(18,153,90,.3)}.seg .on0{background:#fff;color:var(--warn);box-shadow:var(--sh)}
.reps{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh);font-size:14px}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:38px;height:38px;border-radius:12px;background:var(--acc2);color:var(--acc);font-size:22px;font-weight:700;text-align:center}
.stp input{width:56px;border:0;background:var(--bg);border-radius:12px;padding:8px 0;text-align:center;font-size:18px;font-weight:800}
.hl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;font-size:13.5px}.hl+.hl{border-top:1px solid var(--line)}
.hl .w{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600}
/* lists, forms */
.srch{position:relative;margin-bottom:6px}.srch input{width:100%;border:0;border-radius:16px;background:var(--card);box-shadow:var(--sh);padding:14px 14px 14px 44px;outline:none}
.srch svg{position:absolute;left:14px;top:50%;margin-top:-10px;width:20px;height:20px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round}
.li{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border-radius:18px;padding:13px 16px;margin:8px 0;box-shadow:var(--sh)}
.li div{flex:1;min-width:0}.li b{display:block;font-weight:700}.li small{display:block;color:var(--mute);font-size:12.5px}
.li .dt{flex:none;font-size:12px;color:var(--mute);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--acc)}.dot.lo{background:#0b9e9a}
label.f{display:block;margin:12px 0;color:var(--mute);font-size:13px;font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:6px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:500}
.chip{display:inline-block;padding:9px 14px;margin:4px 6px 4px 0;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid #cfd7e6;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px}.ck.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dc{display:flex;align-items:center;gap:10px}.dc .mv{display:flex;flex-direction:column;gap:4px;flex:none}.mv button{width:30px;height:24px;border-radius:8px;background:var(--acc2);color:var(--acc);font-size:12px;text-align:center}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.gh b{flex:1;font-size:17px;font-weight:800}
.mini{padding:6px 12px;border-radius:999px;background:var(--acc2);color:var(--acc);font-size:13px;font-weight:700}.mini.x{background:#fdeceb;color:#c0392b}
.ex{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.ex b{flex:1;font-weight:600;font-size:14.5px}
.ord{width:22px;height:22px;border-radius:7px;background:var(--bg);color:var(--mute);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.hday{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.hday b{font-weight:800}
.fs{position:fixed;inset:0;background:rgba(5,10,25,.94);z-index:9;display:flex;align-items:center;justify-content:center}.fs img{max-width:100%;max-height:100%}
.gs{display:block;text-align:center;color:var(--acc);font-size:13px;font-weight:600;margin:4px 0 8px}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px}

/* v13: intro / set / rest / results */
.exn{font-size:22px;font-weight:800;line-height:1.25;text-align:left;margin:2px 0 0}
.c2.gr{background:#eef2f7;color:#4a5670}
.intro{display:flex;gap:12px;align-items:stretch;margin:16px 0 4px}
.pbig{width:44%;flex:none;align-self:stretch;min-height:200px;border-radius:24px;background:#e6ecfb center/cover no-repeat;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:34px;color:var(--mute)}
.pbig small{font-size:12px;font-weight:600}
.icol{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.yt{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;background:#ff1f3d;color:#fff;border-radius:14px;padding:10px 6px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 6px 14px rgba(255,31,61,.25)}
.yt svg{width:20px;height:20px;fill:#fff;flex:none}
.ytl{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:#e0102c;font-size:13px;font-weight:700;text-decoration:none}.ytl svg{width:18px;height:18px;fill:#ff1f3d}
.kv{background:var(--card);border-radius:16px;padding:9px 11px;box-shadow:var(--sh)}
.kv>small{display:block;color:var(--mute);font-size:11.5px;font-weight:700;margin-bottom:2px}
.kv b{font-size:18px;font-weight:800}.kv small{color:var(--mute);font-size:11.5px}
.wv{direction:ltr;unicode-bidi:isolate;display:inline-block}
.pills{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rp{min-width:28px;padding:2px 7px;border-radius:9px;background:#f0f2f7;color:var(--mute);font-size:13px;font-weight:800;text-align:center}
.rp.g{background:var(--okbg);color:var(--ok)}
.nstp{display:flex;align-items:center;gap:4px;margin-top:4px}
.nstp button{width:32px;height:36px;flex:none;border-radius:10px;background:var(--acc2);color:var(--acc);font-size:20px;font-weight:700;text-align:center}
.nstp input{flex:1;min-width:0;width:100%;border:0;background:var(--bg);border-radius:10px;padding:7px 2px;text-align:center;font-size:17px;font-weight:800;direction:ltr;outline:none}
.nstp span{font-size:11px;color:var(--mute);font-weight:700;flex:none}
.restrow{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.restrow label{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:6px 6px 6px 12px;box-shadow:var(--sh);font-weight:700;font-size:14px}
.restrow select{flex:1;border:0;background:var(--bg);border-radius:12px;padding:10px;font-size:15px;font-weight:700;color:var(--ink)}
.gearb{width:50px;height:50px;flex:none;border-radius:16px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:var(--mute)}.gearb svg{width:22px;height:22px}
.btn.big{padding:18px;font-size:18px;border-radius:18px}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.dots i{width:40px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--acc)}.dots i.dn{background:var(--ok)}
.stt{text-align:center;font-size:32px;font-weight:800;line-height:1.3}
.prev{text-align:center;color:var(--mute);font-size:14px;margin:4px 0 12px}
.wcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--sh);margin:10px 0}
.wcard>div{flex:1}.wcard small{display:block;color:var(--mute);font-size:12.5px;font-weight:600}.wcard b{font-size:30px;font-weight:800;direction:ltr;unicode-bidi:isolate;display:inline-block}
.repin{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--sh);margin:10px 0}
.repin small{display:block;color:var(--mute);font-size:12.5px;font-weight:600;margin-bottom:8px}
.rstp{display:flex;align-items:center;gap:10px}.rstp button{width:58px;height:58px;flex:none;border-radius:16px;background:var(--acc2);color:var(--acc);font-size:28px;font-weight:700;text-align:center}
.rstp input{flex:1;min-width:0;width:100%;border:0;background:var(--bg);border-radius:16px;padding:10px 0;text-align:center;font-size:36px;font-weight:800;outline:none;color:var(--ink)}
.ringw{position:relative;width:250px;height:250px;margin:14px auto 8px}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:14}.ringw .rb{stroke:var(--acc2)}.ringw .rf{stroke:url(#rgd);stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ringw .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringw .ctr b{font-size:60px;font-weight:800;letter-spacing:-1px;line-height:1.1}.ringw .ctr small{color:var(--mute);font-size:14px}
.ringw.dn .rf{stroke:var(--ok)}.ringw.dn .ctr b{color:var(--ok)}
.breath{animation:br 2.4s ease-in-out infinite}@keyframes br{50%{transform:scale(1.025)}}
.tickp{animation:tickp .45s ease-out}@keyframes tickp{0%{transform:scale(1.2);opacity:.6}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .4s cubic-bezier(.2,1.5,.5,1)}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.skip{display:block;margin:8px auto;padding:6px 10px;color:var(--mute);font-size:13px;font-weight:600;text-align:center}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rbx{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh);color:var(--mute);font-size:12.5px;font-weight:600;border:2px solid transparent}
.rbx b{display:block;font-size:30px;font-weight:800;color:var(--ink);margin-top:2px}
.rbx.g{background:var(--okbg);border-color:#9fdcbc;color:var(--ok)}.rbx.g b{color:var(--ok)}
.hint.big{font-size:15px;font-weight:700;padding:14px}
.banner{display:flex;align-items:center;gap:10px;width:100%;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;margin:8px 0}
.banner div{flex:1;min-width:0}.banner small{color:#b9c2dc;display:block;font-size:12px}.banner b{display:block}
.part .ph{padding:0}
.pmain{flex:1;display:flex;align-items:center;gap:12px;min-width:0;padding:14px 12px 14px 4px}
.swap{width:40px;align-self:stretch;flex:none;display:flex;align-items:center;justify-content:center;border-inline-start:1px solid var(--line)}
.brow{display:flex;gap:10px;margin-top:6px}.brow .btn{flex:1;margin:6px 0}
.sumh{display:flex;gap:14px;align-items:center;margin:4px 0 10px}.sumh .thumb{width:104px;height:104px;flex:none}
.tl{padding:4px 16px}.tlr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0}.tlr+.tlr{border-top:1px solid var(--line)}.tln{font-weight:800;font-size:16px}.tlr.rst{padding:8px 0;color:var(--mute);font-size:14px}

/* v18: wheel picker, day log, slideshow */
.wwrap{position:relative;margin-top:4px}
.wwrap::before{content:'';position:absolute;left:0;right:0;top:40px;height:40px;background:var(--acc2);border-radius:12px;pointer-events:none}
.wheel{position:relative;height:120px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wpad{height:40px}
.wi{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-weight:700;font-size:17px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.wi.on{color:var(--acc);font-size:21px;font-weight:800}
.wwrap.wide .wi{font-size:15px}.wwrap.wide .wi.on{font-size:16px}
.wrow{display:flex;gap:8px}.wrow>div{flex:1;min-width:0}.wrow small{display:block;text-align:center;color:var(--mute);font-size:11px;font-weight:700}

const SCH={P2:'2.5 kg steps · weight of plates on each side',P1:'2.5 kg steps · one plate, not two-sided',DB:'1 kg steps up to 10, then 2 kg up to 40 · weight of each dumbbell',C1:'Glute kickback and assist machines stop at 68',C2:'Lat pulldown, cable row, rear delt and pec fly stop at 134 · leg extension and converging chest press at 113',C3:'Adjustable cable station',M3:'3-in-1 press machine',H:'Seated row machine and single-arm cable row stop at 97',LC:'Two-way leg curl / extension machine'};
const SCD={},CAP={};[['P2','pic ibb vb fbb bar pll plr smr smt smgm sp smg bcb fob hk lp ps sml smdl gt sc scr'],['P1','nf nb'],['DB','hy lrd dsl tw'],['C1','da chin csp tp to cr ccr pl gk'],['C2','cp fly lat csr rd hl le'],['C3','cf sh cut pt lr fp rcf bc hc fo wc pal ti'],['M3','inc cp3 sp3'],['H','row sar ad ab'],['LC','sl']].forEach(([c,s])=>s.split(' ').forEach(i=>SCD[i]=c));
[[68,'da chin gk'],[113,'cp le'],[134,'fly lat csr rd'],[97,'row sar']].forEach(([n,s])=>s.split(' ').forEach(i=>CAP[i]=n));
const scOf=id=>db.sc[id]||SCD[id]||'P2';
const scVals=id=>{const c=scOf(id),v=SV[c];return(!db.sc[id]||db.sc[id]==SCD[id])&&CAP[id]?v.filter(x=>x<=CAP[id]):v};
const unit=id=>{const c=scOf(id);return c=='P2'?'kg per side':c=='DB'?'kg per dumbbell':'kg'};
const near=(V,x)=>{if(x===''||x==null)return -1;const n=nw(x);let b=0;V.forEach((y,k)=>{if(Math.abs(y-n)<Math.abs(V[b]-n))b=k});return b};
const nextW=id=>{const l=lst(id),V=scVals(id),s=AST.includes(id)?-1:1,up=isN(l)&&l.ok;return lastW(id).map(x=>{const k=near(V,x);if(k<0)return String(V[0]);return String(V[Math.max(0,Math.min(V.length-1,k+(up?s:0)))])})};
const okReps=(id,e)=>e.rp.every(a=>a.length==3&&a.every(r=>r>=mx(id)));
const reps=a=>(a||[]).map(fn).join('·');
const fw=(id,l)=>!l?'':md(id)=='f'&&l.w.length>3?l.w.slice(0,3).join(' / ')+'  |  '+l.w.slice(3).join(' / '):l.w.join(' / ');
const logTxt=(id,e)=>{if(!e)return'No history';if(isN(e)){const L=lanes(id);return e.w.map((w,j)=>(L[j]?L[j]+' ':'')+w+' × '+(e.ok?'👍':reps(e.rp[j]))).join('  |  ')}return fw(id,e)+' '+(e.ok?'👍':'· '+fn(e.r??'?'))};
function stat(id){if(tod(id))return['✓ Today','ok'];const l=lst(id);if(!l)return['New',''];if(isN(l))return l.ok?['👍 Heavier','up']:[reps(l.rp[0]),'w'];return l.ok?['👍','up']:[fn(l.r??'?')+' reps','w']}
const RO=[60,90,120,150,180];
const restOf=id=>+db.rest[id]||+db.rdef||120;
const tf=s=>s>=60?fn(Math.floor(s/60))+':'+fn(String(s%60).padStart(2,'0')):fn(s);

// ---------- which day is today: next one after the last trained day
function autoIdx(){const n=db.days.length;if(!n)return -1;let b=null;
 for(const src of [db.logs,db.arch])for(const id in src)for(const e of src[id]){const j=db.days.findIndex(d=>d.id==e.p);if(j<0)continue;if(!b||e.d>b.d||(e.d==b.d&&(e.t||0)>=b.t))b={d:e.d,t:e.t||0,j}}
 return !b?0:b.d==D()?b.j:(b.j+1)%n}
function curIdx(){const T=D();if(db.sel&&db.sel.d==T){const j=db.days.findIndex(d=>d.id==db.sel.id);if(j>=0)return j}return autoIdx()}

// ---------- rotation: for each body part suggest the exercise after the one done last time
function plan(d){const used=new Set(),out=d.parts.map(p=>{const dn=[...p.ex,...pool(p.a)].find(i=>!used.has(i)&&tod(i));if(dn)used.add(dn);return{p,dn}});
 out.forEach(o=>{if(o.dn)return;const ex=o.p.ex.length?o.p.ex:pool(o.p.a);if(!ex.length)return;
  const c=ex.filter(i=>!used.has(i)),f=c.length?c:ex;let b=null,bd=null;
  for(const i of f){const l=lst(i),d=l?l.d:'';if(b===null||d<bd){b=i;bd=d}}
  o.s=b;used.add(b)});
 return out}

// ---------- navigation
let v={s:'home',tab:'home'},OPEN=null,MORE=null;
const go=(s,o)=>{v={tab:v.tab,...(o||{}),s};render()};
const tab=t=>{v={s:t,tab:t};OPEN=MORE=null;render()};
const BK='<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';
const hdr=(t,back,sub,extra)=>`<div class="top">${back?`<button class="back" onclick="${back}">${BK}</button>`:''}<h1>${t}${sub?`<span class="sub">${sub}</span>`:''}</h1>${extra||''}</div>`;

// ---------- wheel picker
const WH=40,WV={};let WT=0;
const wheel=(id,vals,cur,lab)=>{WV[id]=vals;let k=typeof cur=='number'?cur:near(vals,cur);if(k<0)k=0;return`<div class="wheel" id="${id}" data-i="${k}" onscroll="whs(this)"><div class="wpad"></div>${vals.map((x,j)=>`<div class="wi ${j==k?'on':''}" onclick="whTo('${id}',${j})">${lab?lab(x):x}</div>`).join('')}<div class="wpad"></div></div>`};
const whs=el=>{const k=Math.max(0,Math.min(WV[el.id].length-1,Math.round(el.scrollTop/WH)));if(+el.dataset.i!=k){el.dataset.i=k;el.querySelectorAll('.wi').forEach((x,j)=>x.classList.toggle('on',j==k))}};
const whTo=(id,k)=>{const el=$('#'+id);el.scrollTo({top:k*WH,behavior:'smooth'})};
const whVal=id=>{const el=$('#'+id);return WV[id][+el.dataset.i]};
const initWheels=()=>document.querySelectorAll('.wheel').forEach(w=>{w.scrollTop=+w.dataset.i*WH});

// ---------- workout tab
function home(){const n=db.days.length,bkd=db.bk?(Date.parse(D())-Date.parse(db.bk))/864e5:99;
 let h=hdr('Workout','',fd(D()));
 if(db.run){const r=db.run;h+=`<button class="banner" onclick='go("run",${q({i:r.id,k:r.k,a:r.a,o:r.o})})'><div><small>Exercise in progress</small><b dir="ltr" style="text-align:left">${X(r.id)[0]}</b><small>Set ${fn(r.set+1)} of 3</small></div><span class="ghost">Continue</span></button>`}
 if(bkd>14)h+=`<div class="hint w" onclick="tab('set')">It’s been over two weeks since your last backup. Tap here to back up.</div>`;
 if(!n)return h+`<div class="hint" onclick="tab('prog')">You don’t have any workout days yet. Tap here to create one in Program.</div>`;
 const j=curIdx(),au=autoIdx(),d=db.days[j],P=plan(d),dn=P.filter(o=>o.dn).length;
 h+=`<div class="hero"><div class="hrow">${j==au?'<span class="badge">Up today</span>':`<span class="badge">Picked manually</span><button class="ghost" onclick="pickDay('')">Back to scheduled day</button>`}</div>
 <div class="sel"><select onchange="pickDay(this.value)">${db.days.map((x,i)=>`<option value="${x.id}" ${i==j?'selected':''}>Day ${fn(i+1)} · ${x.n}</option>`).join('')}</select><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
 <div class="bar"><i style="width:${P.length?dn/P.length*100:0}%"></i></div><small>${P.length?fn(dn)+' of '+fn(P.length)+' parts done':'This day has no body parts yet'}</small></div>`;
 if(!P.length)h+=`<div class="hint" onclick="v.tab='prog';go('day',{k:'${d.id}'})">This day is empty. Tap here to add body parts in Program.</div>`;
 if(n&&P.length&&dn==P.length)h+=`<div class="hint ok">✓ All parts of this day are done. Next up: Day ${fn((j+1)%n+1)} · ${db.days[(j+1)%n].n}.</div>`;
 h+=P.map((o,x)=>{const a=o.p.a,id=o.dn||o.s,open=OPEN==a,ex=o.p.ex.length?o.p.ex:pool(a),oth=pool(a).filter(i=>!ex.includes(i)),[st,c]=id?stat(id):['',''];
  const row=(i,isS)=>{const[s2,c2]=stat(i),l=lst(i);return`<button class="row ${isS?'sug':''}" onclick='go("in",{i:"${i}",k:"${d.id}",a:"${a}",o:"home"})'><div><b dir="ltr">${X(i)[0]}${isS?'<span class="st">Suggested</span>':''}</b><small dir="ltr">${logTxt(i,l)}</small></div><span class="tag ${c2}">${s2}</span></button>`};
  const main=id?`go("in",${q({i:id,k:d.id,a,o:'home'})})`:`tg("${a}")`;
  return`<div class="part ${o.dn?'done':''} ${open?'open':''}"><div class="ph"><button class="pmain" onclick='${main}'><span class="num">${o.dn?'✓':fn(x+1)}</span><div class="pt"><b>${A[a]}</b><small>${id?`<i>${o.dn?'Done':'Suggested'}:</i> <span dir="ltr">${X(id)[0]}</span>`:'No exercise selected'}</small></div>${id&&!o.dn?`<span class="tag ${c}">${st}</span>`:''}</button><button class="swap" onclick="tg('${a}')">${CH}</button></div>
  <div class="pl">${ex.map(i=>row(i,i==id)).join('')}${oth.length?`<button class="more" onclick="tm('${a}')">${MORE==a?'Hide other exercises':'Other exercises for this part ('+fn(oth.length)+')'}</button>${MORE==a?'<div class="oth">'+oth.map(i=>row(i,i==id)).join('')+'</div>':''}`:''}</div></div>`}).join('');
 if(P.length)h+=`<button class="btn pri big" style="margin-top:18px" onclick="finDay('${d.id}')">Finish workout day</button>`;
 return h}
const finDay=k=>{const n=Object.values(db.logs).filter(L=>L.some(e=>e.d==D())).length;if(!n&&!confirm('Nothing logged today yet. Finish the day anyway?'))return;db.fdone[D()]={k,t:Date.now()};db.sel=null;save();go('dlog',{d:D(),o:'home'})};
const tg=a=>{OPEN=OPEN==a?null:a;MORE=null;render(1)},tm=a=>{MORE=MORE==a?null:a;render(1)};
const pickDay=k=>{db.sel=k?{d:D(),id:k}:null;OPEN=null;save();render()};

// ---------- exercise: shared bits
const GE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
const YTI='<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9l5.8 3.1z"/></svg>';
const YT=id=>'https://www.youtube.com/results?search_query='+encodeURIComponent('how to do '+X(id)[0]+' exercise');
const ctx=()=>({i:v.i,k:v.k,a:v.a,o:v.o,q:v.q,f:v.f});
const gin=()=>go('in',ctx()),ged=f=>go('edit',{...ctx(),f});
const backEx=()=>v.o=='home'?`tab('home')`:v.o=='lib'?`go('lib',{q:'${(v.q||'').replace(/['"\\]/g,'')}'})`:v.k?`go('day',{k:'${v.k}'})`:`tab('lib')`;
const dchip=()=>{const d=v.k&&dy(v.k);return d&&v.o=='home'?`<span class="c2">${d.n} · ${A[v.a]||''}</span>`:''};
const chips=id=>`<div class="chips"><span class="c2 ${tier(id)=='Upper body'?'':'lo'}">${tier(id)}</span>${mus(id)?`<span class="c2 gr">${A[mus(id)]}</span>`:''}</div>`;
const histBlock=id=>{const hs=(db.logs[id]||[]).slice(-6).reverse(),ar=db.arch[id]||[];return(hs.length?`<div class="sec">History</div><div class="card" style="padding:6px 16px">${hs.map(x=>`<div class="hl"><span class="mute">${fd(x.d)}</span><span class="w">${logTxt(id,x)}</span></div>`).join('')}</div>`:'')+
 (ar.length?`<button class="btn sm" onclick="OLDX=OLDX==v.i?null:v.i;render(1)">Old records (${fn(ar.length)})</button>`+(OLDX==id?`<div class="card" style="padding:6px 16px">${ar.slice().reverse().map(x=>`<div class="hl"><span class="mute">${fd(x.d)}</span><span class="w">${logTxt(id,x)}</span></div>`).join('')}</div>`:''):'')};
let OLDX=null;
function lastBlock(id){const l=lst(id),L=lanes(id),M=mx(id);if(!l||!isN(l))return`<b class="mute" style="font-size:14px">No records yet</b>`;
 return L.map((ln,j)=>`<div>${ln?`<small>${ln}</small>`:''}<div class="pills">${l.ok?'<span class="rp g">👍</span>':[0,1,2].map(s=>{const r=(l.rp[j]||[])[s];return`<span class="rp ${r>=M?'g':''}">${r==null?'—':fn(r)}</span>`}).join('')}</div></div>`).join('')+`<small>${fd(l.d)}</small>`}

// ---------- exercise intro page (before starting)
function intro(){const id=v.i,e=X(id),L=lanes(id),W=nextW(id),r=db.run,l=lst(id),ro=[...new Set([...RO,restOf(id)])].sort((a,b)=>a-b);
 let h=hdr('',backEx(),'',dchip());
 h+=`<h2 class="exn" dir="ltr">${e[0]}</h2>${chips(id)}<a class="yt" href="${YT(id)}" target="_blank" rel="noopener">${YTI}Watch on YouTube</a>`;
 h+=`<div class="intro"><div id="ph" class="pbig" onclick="pz()"></div><div class="icol">
  <div class="kv"><small>Max reps</small><b>${fn(mx(id))}</b> <small>× 3 sets${side(id)?' · per side':''}</small></div>
  <div class="kv"><small>Last result</small>${lastBlock(id)}</div>
  <div class="kv"><small>Weight this session</small><div class="wrow">${L.map((ln,j)=>`<div>${ln?`<small>${ln}</small>`:''}<div class="wwrap">${wheel('nw'+j,scVals(id),W[j])}</div></div>`).join('')}</div><span class="unit">${unit(id)}</span></div>
 </div></div>`;
 h+=`<div class="restrow"><label>Rest<select onchange="db.rest[v.i]=+this.value;save()">${ro.map(s=>`<option value="${s}" ${s==restOf(id)?'selected':''}>${fn(s)} sec</option>`).join('')}</select></label><button class="gearb" onclick="ged('in')">${GE}</button></div>`;
 h+=`<button class="btn pri big" onclick="start()">${r&&r.id==id?'Continue exercise':'Start'}</button>`;
 h+=lastSession(id);
 return h+histBlock(id)}
function start(){const id=v.i,r=db.run;if(r&&r.id==id)return go('run',ctx());
 if(r&&!confirm('"'+X(r.id)[0]+'" is in progress. Drop it and start this one?'))return;
 const w=lanes(id).map((_,j)=>String(whVal('nw'+j)));
 stopTick();db.run={id,k:v.k||'',a:v.a||'',o:v.o||'lib',d:D(),w,rp:lanes(id).map(()=>[]),set:0,ph:'set'};save();go('run',ctx())}

// ---------- set / rest screens
const RC2=2*Math.PI*104,SN=['1','2','3'];
function run(){const r=db.run;if(!r)return intro();const id=r.id,L=lanes(id),M=mx(id),pvv=(db.logs[id]||[]).filter(e=>isN(e)&&e.d!=D()).slice(-1)[0];
 let h=hdr('',`go('in',${q({i:id,k:r.k,a:r.a,o:r.o})})`,'',`<span class="c2" dir="ltr">${X(id)[0]}</span>`);
 h+=`<div class="dots">${[0,1,2].map(j=>`<i class="${j<r.set||(j==r.set&&r.ph=='rest')?'dn':j==r.set?'on':''}"></i>`).join('')}</div>`;
 if(r.ph=='set'){
  h+=`<div class="stt">Set ${SN[r.set]}</div>`;
  h+=`<div class="prev">${pvv?'Last time in this set: '+L.map((ln,j)=>(ln?ln+' ':'')+fn((pvv.rp[j]||[])[r.set]??'—')).join(' · ')+' reps':'No history for this set'} · max ${fn(M)}${side(id)?' (per side)':''}</div>`;
  h+=`<div class="wcard"><div><small>Working weight</small>${L.map((ln,j)=>`<b>${r.w[j]}</b> <span class="mute">${unit(id)}${ln?' · '+ln:''}</span>`).join('<br>')}</div><button class="gearb" onclick="ew()">${GE}</button></div>`;
  h+=L.map((ln,j)=>{const b=pvv&&(pvv.rp[j]||[])[r.set]!=null?pvv.rp[j][r.set]:M;return`<div class="repin"><small>Reps done${ln?' · '+ln:''}</small><div class="rstp"><button onclick="rq(${j},-1)">−</button><input id="rp${j}" type="number" inputmode="numeric" data-b="${b}" placeholder="${b}" value="${r.rp[j][r.set]??''}"><button onclick="rq(${j},1)">+</button></div></div>`}).join('');
  h+=`<button class="btn pri big" onclick="doneSet()">${r.set<2?'Rest':'Finish exercise'}</button>`;
 }else{const left=r.re-Date.now(),dn=left<=0;
  h+=`<div class="stt" style="font-size:24px">${dn?'Rest over':'Rest'}</div>`;
  h+=`<div class="ringw ${dn?'dn pop':'breath'}"><svg viewBox="0 0 240 240"><defs><linearGradient id="rgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a55ff"/><stop offset="1" stop-color="#8fa0ff"/></linearGradient></defs><circle class="rb" cx="120" cy="120" r="104"/><circle id="rr" class="rf" cx="120" cy="120" r="104" stroke-dasharray="${RC2}" stroke-dashoffset="${dn?0:RC2*(1-left/(r.rt*1000))}"/></svg><div class="ctr"><b id="rn" dir="ltr">${dn?'✓':tf(Math.ceil(left/1000))}</b><small>${dn?'Ready for set '+SN[r.set+1]:'of '+tf(r.rt)+(r.rt<60?' sec':'')}</small></div></div>`;
  h+=`<div class="prev">Set ${SN[r.set]} logged: ${L.map((ln,j)=>(ln?ln+' ':'')+fn(r.rp[j][r.set])).join(' · ')} reps at <span class="wv">${r.w.join(' / ')}</span> ${unit(id)}</div>`;
  h+=`<div class="brow"><button ${dn?'id="nx" class="btn pri pop"':'class="btn"'} onclick="${dn?'nextSet()':'skipRest()'}">${dn?'Start set '+SN[r.set+1]:'Skip rest'}</button><button class="btn red" onclick="cancelRun()">Cancel exercise</button></div>`;
 }
 return h+(r.ph=='set'?`<button class="skip" style="margin-top:22px;color:#c0392b" onclick="cancelRun()">Cancel this exercise</button>`:'')}
const rq=(j,d)=>{const i=$('#rp'+j);if(i.value===''){i.value=i.dataset.b;return}i.value=Math.max(0,(+i.value||0)+d)};
const ew=()=>{const r=db.run,L=lanes(r.id),o=document.createElement('div');o.className='modal';o.onclick=e=>{if(e.target==o)o.remove()};
 o.innerHTML=`<div class="sheet"><b>Weight for all 3 sets</b><small>${unit(r.id)}</small><div class="wrow">${L.map((ln,j)=>`<div>${ln?`<small>${ln}</small>`:''}<div class="wwrap">${wheel('mw'+j,scVals(r.id),r.w[j])}</div></div>`).join('')}</div><div class="brow"><button class="btn" onclick="this.closest('.modal').remove()">Cancel</button><button class="btn pri" onclick="ewSave()">Save</button></div></div>`;
 document.body.appendChild(o);initWheels()};
const ewSave=()=>{const r=db.run;lanes(r.id).forEach((_,j)=>r.w[j]=String(whVal('mw'+j)));$('.modal').remove();save();render()};
function doneSet(){const r=db.run,L=lanes(r.id),vals=L.map((_,j)=>$('#rp'+j).value.trim());
 if(vals.some(x=>x===''||isNaN(+x)))return alert('Enter the reps for this set');
 vals.forEach((x,j)=>r.rp[j][r.set]=Math.max(0,Math.round(+x)));
 if(r.set<2){r.ph='rest';r.rt=restOf(r.id);r.rs=Date.now();r.re=r.rs+r.rt*1000;r.fd=0;save();try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}askN();lock();startTick();render()}
 else finishRun()}
const nextSet=()=>{const r=db.run;(r.rtk=r.rtk||[])[r.set]=Math.round((Date.now()-(r.rs||Date.now()))/1000);r.set++;r.ph='set';save();render()};
const skipRest=()=>{const r=db.run;r.fd=1;stopTick();relLock();nextSet()};
function finishRun(){const r=db.run,id=r.id,e={d:D(),p:r.o=='home'?r.k:'',w:r.w,rp:r.rp,rt:r.rtk||[],rest:r.rt||restOf(id),t:Date.now()};e.ok=okReps(id,e);
 db.logs[id]=(db.logs[id]||[]).filter(x=>x.d!=D());db.logs[id].push(e);if(r.o=='home'&&db.sel&&db.sel.id==r.k)db.sel=null;
 db.run=null;stopTick();relLock();save();go('done',{i:id,k:r.k,a:r.a,o:r.o})}
const cancelRun=()=>{if(!confirm('Cancel this exercise? Nothing will be saved.'))return;const r=db.run;db.run=null;stopTick();relLock();save();go('in',{i:r.id,k:r.k,a:r.a,o:r.o})};

// ---------- exercise result page (after finishing)
// last session block (shown on the exercise page under Start)
function lastSession(id){const l=lst(id),L=lanes(id),M=mx(id);if(!l||!isN(l))return'';

 if(left>0){if(v.s=='run'){const g=$('#rr'),n=$('#rn');if(g)g.style.strokeDashoffset=RC2*(1-left/(r.rt*1000));const s=Math.ceil(left/1000);if(n&&n.dataset.s!=s){n.dataset.s=s;n.textContent=tf(s);n.classList.remove('tickp');void n.offsetWidth;n.classList.add('tickp')}}}
